name: Proposer une amélioration
description: Une idée pour rendre Aska plus utile.
labels: [amélioration, à trier]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Quel besoin ?
      description: Le problème que vous rencontrez aujourd'hui, avant la solution.
      placeholder: "Quand je travaille sur deux projets, je dois rechoisir le dossier à chaque fois…"
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Proposition
      description: Ce que vous imaginez, comportement et interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: Je suis prêt·e à proposer une PR pour cette amélioration.
