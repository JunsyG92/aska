name: Suggest an improvement
description: An idea to make Aska more useful.
labels: [enhancement, triage]
body:
  - type: textarea
    id: need
    attributes:
      label: What need?
      description: The problem you run into today, before the solution.
      placeholder: "When I work on two projects, I have to pick the folder again every time..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you have in mind, behavior and UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this improvement.
