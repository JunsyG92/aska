name: Report a bug
description: Something does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this problem.
        **A security vulnerability?** Do not open it here: follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happens?
      description: What you did, what you expected, what happened.
      placeholder: "I press Ctrl+Alt+Space, the window does not open..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (X11)
        - Linux (Wayland)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and desktop (Linux)
      placeholder: Ubuntu 24.04, GNOME 46
  - type: dropdown
    id: agents
    attributes:
      label: Agent(s) involved
      multiple: true
      options: [Claude, Codex, Copilot, Cursor, None in particular]
  - type: textarea
    id: diagnostic
    attributes:
      label: Output of "aska --help"
      description: It shows the version and the status of each agent. Mask anything you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages, screenshots
      description: Message shown by Aska, terminal output... Do not paste API keys or confidential content.
