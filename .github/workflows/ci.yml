# Continuous integration: lint, unit and end-to-end tests on Linux and
# Windows, Windows installation. The "CI" job sums it all up: it is the only
# check to make required in branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The title becomes the message of the merged (squash) commit: it must follow
      # Conventional Commits, which the version number and the CHANGELOG depend on.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const types = ['feat', 'fix', 'perf', 'refactor', 'docs', 'test', 'build', 'ci', 'chore', 'style', 'revert'];
            const re = new RegExp(`^(${types.join('|')})(\\([a-z0-9-]+\\))?!?: \\S.*$`);
            if (!re.test(title)) {
              core.setFailed(
                `Invalid title "${title}". Expected: <type>(<optional scope>): <description>, ` +
                `type one of ${types.join(', ')}. Example: "feat(notifications): optional sound". See CONTRIBUTING.md.`
              );
            } else {
              core.info(`Valid title: ${title}`);
            }

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        # Les runners GitHub n'autorisent pas le bac à sable d'Electron (espaces de noms
        # restreints) : le test lance donc Electron avec --no-sandbox.
        env:
          ASKA_E2E_NO_SANDBOX: '1'
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:e2e
      - name: Outside click, with a real window manager (Linux)
        if: runner.os == 'Linux'
        env:
          ASKA_E2E_NO_SANDBOX: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openbox xdotool xterm
          xvfb-run -a -s "-screen 0 1400x900x24" bash test/e2e/outside-click.sh
      - name: End-to-end test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: End-to-end test (macOS)
        if: runner.os == 'macOS'
        run: npm run test:e2e
      - name: Installation (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/install.sh --no-autostart --no-sandbox-fix
          L="$HOME/.local/bin/aska"
          test -x "$L" || { echo 'aska command missing'; exit 1; }
          sh -n "$L"
          test -f "$HOME/.config/aska/config.json" || { echo 'config missing'; exit 1; }
          "$L" --help | tee /dev/stderr | grep -q 'Usage: aska'
          # Wayland session: the command runs Aska through XWayland, unless a backend is given.
          grep -q -- '--ozone-platform=x11' "$L" || { echo 'XWayland switch missing'; exit 1; }
      - name: Installation (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/install.sh --no-autostart
          test -x "$HOME/.local/bin/aska" || { echo 'aska command missing'; exit 1; }
          test -x "$HOME/Applications/Aska.app/Contents/MacOS/Aska" || { echo 'Aska.app missing'; exit 1; }
          test -f "$HOME/.config/aska/config.json" || { echo 'config missing'; exit 1; }
          plutil -lint "$HOME/Applications/Aska.app/Contents/Info.plist"
          "$HOME/.local/bin/aska" --help | tee /dev/stderr | grep -q 'Usage: aska'
          "$HOME/.local/bin/aska" --version | grep -Eq '^aska [0-9]'
      - name: Installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows PowerShell 5.1, as documented in the README (not pwsh).
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -NoAutostart
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          $bytes = [IO.File]::ReadAllBytes((Join-Path $env:APPDATA 'aska\config.json'))
          if ($bytes[0] -eq 0xEF) { throw 'config.json starts with a UTF-8 BOM' }
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $programs 'Aska.lnk'))) { throw 'Start menu shortcut missing' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'aska\config.json'))) { throw 'configuration missing' }
          # The shortcut must carry the app identity, otherwise no notifications.
          $shell = New-Object -ComObject Shell.Application
          $item = $shell.Namespace($programs).ParseName('Aska.lnk')
          $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
          Write-Host "Shortcut AppUserModelID: $aumid"
          if ($aumid -ne 'aska') { throw "AppUserModelID missing or wrong: '$aumid'" }
          $aska = Join-Path $env:LOCALAPPDATA 'aska\bin\aska.cmd'
          if (-not (Test-Path $aska)) { throw 'aska command missing' }
          $help = & $aska --help | Out-String
          Write-Host $help
          if ($help -notmatch 'Usage: aska') { throw 'aska --help does not respond' }
          $version = & $aska --version | Out-String
          if ($version -notmatch '^aska \d') { throw 'aska --version does not respond' }
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.os }}
          path: test/e2e/out/
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs: [lint, pr-title, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::At least one check failed ($r)"; exit 1 ;; esac
          done
