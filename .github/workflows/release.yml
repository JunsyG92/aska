# Automatic versioning (release-please): on every merge to main, a
# "chore(main): release x.y.z" PR is kept up to date with the CHANGELOG and the
# version number, derived from PR titles (Conventional Commits). Merging it creates
# the vX.Y.Z tag and the GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional token (see CONTRIBUTING.md): with the default token, CI does not
          # run on the release PR, which only an administrator can then merge.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  archive:
    name: Attach the archive to the release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Archive and checksum
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix="aska-${TAG}/" -o "aska-${TAG}.tar.gz" "$TAG"
          sha256sum "aska-${TAG}.tar.gz" > "aska-${TAG}.tar.gz.sha256"
          gh release upload "$TAG" "aska-${TAG}.tar.gz" "aska-${TAG}.tar.gz.sha256" --clobber
