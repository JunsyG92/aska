name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Test de bout en bout (Linux)
        if: ${{ always() && runner.os == 'Linux' }}
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:e2e
      - name: Test de bout en bout (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        run: npm run test:e2e
      - name: Installation (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          ./scripts/install.ps1 -NoAutostart
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $programs 'Aska.lnk'))) { throw 'raccourci du menu Démarrer absent' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'aska\config.json'))) { throw 'configuration absente' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'aska\bin\aska.cmd'))) { throw 'commande aska absente' }
          Write-Host 'Installation OK'
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: test/e2e/out/
          if-no-files-found: ignore
